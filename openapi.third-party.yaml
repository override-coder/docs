        crypto_m5:
          type: integer
          enum:
          - 1
          - 2
          description: "`crypto_m5`; enables or disables 5-minute crypto markets."
        crypto_m15:
          type: integer
          enum:
          - 1
          - 2
          description: "`crypto_m15`; enables or disables 15-minute crypto markets."
        crypto_h1:
          type: integer
          enum:
          - 1
          - 2
          description: "`crypto_h1`; enables or disables 1-hour crypto markets."
        crypto_h4:
          type: integer
          enum:
          - 1
          - 2
          description: "`crypto_h4`; enables or disables 4-hour crypto markets."
        crypto_btc:
          type: integer
          enum:
          - 1
          - 2
          description: "`crypto_btc`; enables or disables BTC crypto markets."
        crypto_eth:
          type: integer
          enum:
          - 1
          - 2
          description: "`crypto_eth`; enables or disables ETH crypto markets."
        crypto_sol:
          type: integer
          enum:
          - 1
          - 2
          description: "`crypto_sol`; enables or disables SOL crypto markets."
        crypto_xrp:
          type: integer
          enum:
          - 1
          - 2
          description: "`crypto_xrp`; enables or disables XRP crypto markets."
        politics:
          type: integer
          enum:
          - 1
          - 2
          description: "`politics`; enables or disables politics markets."
        weather:
          type: integer
          enum:
          - 1
          - 2
          description: "`weather`; enables or disables weather markets."
        other:
          type: integer
          enum:
          - 1
          - 2
          description: "`other`; enables or disables uncategorized/other markets."
        config_type:
          type: integer
          enum:
          - 1
          - 2
          description: Use `1` for copytrade configurations. These endpoints do not
            support template configuration writes (`2`).
