    CopytradeKeywordInput:
      type: object
      required:
      - key_word
      - list_type
      - config_type
      properties:
        key_word:
          type: string
          description: Keyword text to add to the config keyword list.
        list_type:
          type: integer
          enum:
          - 1
          - 2
          description: "`list_type`; `1` means whitelist, `2` means blacklist."
        config_type:
          type: integer
          enum:
          - 1
          description: Must be 1 (application copytrade config); templates are not
            supported by this HTTP endpoint.
    CopytradeKeywordResult:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          description: keyword advisory code. Empty string means no advisory; KEYWORD_IN_BLACKLIST
            means the keyword also appears in the blacklist. This is not the outer
            API response code.
    CopytradeMutationResult:
      type: object
      additionalProperties: false
      description: Empty object acknowledging a successful keyword deletion or market-type
        update.
    CopytradeMarketTypesUpdateInput:
      allOf:
      - "$ref": "#/components/schemas/CopytradeMarketTypesInput"
      - type: object
        properties:
          config_type:
            type: integer
            enum:
            - 1
            description: Must be 1 (application copytrade config); templates are not
              supported by this HTTP endpoint.
    AFKStrategyList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/AFKStrategy"
    AFKStrategy:
      allOf:
      - "$ref": "#/components/schemas/AFKStrategyInput"
      - type: object
        required:
        - config_id
        - status
        properties:
          config_id:
            type: string
            description: AFK strategy id from `config_id`.
          status:
            "$ref": "#/components/schemas/AFKStatus"
          created_at:
            type: string
            format: date-time
            nullable: true
            description: Strategy create time derived from `create_dt`.
      description: AFK strategy values in GET responses. The PATCH success response
        uses this shape as an acknowledgement; query the strategy to read its final
        configuration.
    AFKStrategyInput:
      type: object
      required:
      - market
      - side
      - buy_amount
      properties:
        tag:
          type: string
          description: User-visible strategy label.
        market:
          type: string
          description: Market code for an AFK symbol and duration. For example, BTC5
            selects 5 minutes and BTC selects 15 minutes. Use a market code rather
            than a condition ID or market slug. See [AFK market codes](/concepts/api-parity#afk-market-codes)
            for the supported families and durations.
        period:
          type: integer
          description: Configured period in seconds. The trading round duration is
            selected by market; changing period alone does not select a different
            market duration. On PATCH, `0` keeps the current value and `-1` resets
            it to `0`. Omitting this field also keeps its current value.
        side:
          type: integer
          enum:
          - 1
          - 2
          description: Direction filter; `1` means Up, `2` means Down.
        time_start_sec:
          type: integer
          format: int64
          description: Configured earliest entry time in seconds after the start of
            each market round, inclusive. This is a relative offset, not a Unix timestamp.
        time_end_sec:
          type: integer
          format: int64
          description: Configured entry cutoff in seconds after the start of each
            market round, exclusive. A stored value at or below zero, or beyond the
            round duration, uses the end of the round. This is not a Unix timestamp.
        min_price:
          type: string
          description: Minimum outcome-token price allowed for entry. Decimal string.
            On PATCH, `"0"` keeps the current value and `"-1"` resets it to `"0"`.
            Omitting this field also keeps its current value.
        max_price:
          type: string
          description: Maximum outcome-token price allowed for entry. Decimal string.
            On PATCH, `"0"` keeps the current value and `"-1"` resets it to `"0"`.
            Omitting this field also keeps its current value.
        price_delta_min:
          type: string
          description: Minimum change in the underlying cryptocurrency price since
            the round opened (current price minus opening price). An absolute price
            difference, not a percentage. On PATCH, `"0"` keeps the current value
            and `"-1"` resets it to `"0"`. Omitting this field also keeps its current
            value.
        price_delta_max:
          type: string
          description: Maximum change in the underlying cryptocurrency price since
            the round opened (current price minus opening price). An absolute price
            difference, not a percentage. On PATCH, `"0"` keeps the current value
            and `"-1"` resets it to `"0"`. Omitting this field also keeps its current
            value.
        buy_amount:
          type: string
          description: Buy amount per AFK order in USD. Decimal string. On PATCH,
            `"0"` keeps the current value and `"-1"` resets it to `"0"`.
        limit_price:
          type: string
          description: Order price used when the strategy is in limit-order mode.
            Decimal string. On PATCH, `limit_order_copy=1` toggles the mode rather
            than selecting a final state; see [AFK updates](/concepts/api-parity#afk-updates).
            On PATCH, `"0"` keeps the current value and `"-1"` resets it to `"0"`.
            Omitting this field also keeps its current value.
        order_expired_ttl_seconds:
          type: integer
          description: Limit order expiration TTL in seconds. On PATCH, `0` keeps
            the current value and `-1` resets it to `0`. Omitting this field also
            keeps its current value.
        total_rounds:
          type: integer
          description: Trading rounds to allocate on creation. GET responses return
            the remaining rounds, which decrease after successful order submission.
            On PATCH, a positive value sets the remaining rounds. On PATCH, `0` keeps
            the current value and `-1` resets it to `0`. Omitting this field also
            keeps its current value.
        take_profit_percentage:
          type: string
          description: Take-profit percentage trigger. Decimal string. On PATCH, `"0"`
            keeps the current value and `"-1"` resets it to `"0"`. Omitting this field
            also keeps its current value.
        take_profit_price:
          type: string
          description: Take-profit price trigger. Decimal string. On PATCH, `"0"`
            keeps the current value and `"-1"` resets it to `"0"`. Omitting this field
            also keeps its current value.
        stop_loss_percentage:
          type: string
          description: Stop-loss percentage trigger. Decimal string. On PATCH, `"0"`
            keeps the current value and `"-1"` resets it to `"0"`. Omitting this field
            also keeps its current value.
        stop_loss_price:
          type: string
          description: Stop-loss price trigger. Decimal string. On PATCH, `"0"` keeps
            the current value and `"-1"` resets it to `"0"`. Omitting this field also
            keeps its current value.
        limit_order_copy:
          type: integer
          enum:
          - 0
          - 1
          description: For creation and GET responses, `0` means market order and
            `1` means limit order. On PATCH, `1` toggles the current setting; `0`
            or omission leaves it unchanged.
        slippage:
          type: string
          description: Market order slippage percentage string, for example `2` means
            2%. On PATCH, `"0"` keeps the current value and `"-1"` resets it to `"0"`.
            Omitting this field also keeps its current value.
        use_kdj:
          type: integer
          enum:
          - 0
          - 1
          description: KDJ filter. For creation and GET responses, `0` means disabled
            and `1` means enabled. On PATCH, `1` toggles the current setting; `0`
            or omission leaves it unchanged.
        use_macd:
          type: integer
          enum:
          - 0
          - 1
          description: MACD filter. For creation and GET responses, `0` means disabled
            and `1` means enabled. On PATCH, `1` toggles the current setting; `0`
            or omission leaves it unchanged.
        use_atr:
          type: integer
          enum:
          - 0
          - 1
          description: ATR filter. For creation and GET responses, `0` means disabled
            and `1` means enabled. On PATCH, `1` toggles the current setting; `0`
            or omission leaves it unchanged.
    AFKStatus:
      type: string
      enum:
      - running
      - paused
      - disabled
      description: Public AFK strategy status.
    AFKStrategyCreateResult:
      type: object
      required:
      - status
      description: Creation acknowledgement without a strategy ID. Call GET /afk/strategies
        to read the created strategy.
      properties:
        status:
          type: string
          enum:
          - created
    AFKStrategyUpdateInput:
      allOf:
      - "$ref": "#/components/schemas/AFKStrategyInput"
      - type: object
        properties:
          status:
            "$ref": "#/components/schemas/AFKStatus"
      description: |-
        For time_start_sec and time_end_sec on PATCH, omission or `0` keeps the existing value; `-1` resets it to `0`. A reset start permits entry from the beginning of each round; a reset end uses the end of the round.
        For limit_order_copy, use_kdj, use_macd, and use_atr, `1` toggles the current setting; `0` or omission leaves it unchanged. These inputs are commands, not desired final values. Retry the same operation with its original Idempotency-Key and body. See [AFK updates](/concepts/api-parity#afk-updates).
        PATCH requires market, side, and buy_amount, even when changing another field. For the numeric fields listed in [AFK updates](/concepts/api-parity#afk-updates), zero keeps the current value and minus one resets it to zero; use JSON strings for decimal fields. Do not treat these values as a general rule for all fields.
