    PlaceOrderRequest:
      type: object
      required:
      - asset
      - side
      description: |-
        Omitting price selects a market order; a supplied price must be valid and never falls back to market.
        Market buy requires amount_usd >= 1 and no size. Limit buy requires amount_usd or size; if both are supplied amount_usd must equal price times size.
        Sell requires exactly one of size or sell_percentage and no amount_usd. sell_all requires sell side and, when percentage is used, exactly 100.
        Limit orders with an explicit quantity or amount must represent at least 5 shares. Percentage-based quantities and live market tick sizes are validated at execution.
        Decimal inputs must be plain positive decimal strings (no sign, exponent, whitespace, NaN or Infinity). Omit optional fields instead of sending null.
        The trading service also validates the order before execution.
      properties:
        asset:
          type: string
          pattern: "^[1-9][0-9]{0,77}$"
          description: Positive decimal uint256 token ID (maximum 2^256-1).
        side:
          type: string
          enum:
          - buy
          - sell
        amount_usd:
          type: string
          maxLength: 32
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,6})?$"
          description: Positive amount, at most 1000000000000, up to 6 decimal places.
        price:
          type: string
          maxLength: 32
          pattern: "^0\\.[0-9]{1,4}$"
          description: Limit price from 0.0001 through 0.9999, up to 4 decimal places.
            Omit for a market order. Empty, null, zero or malformed values are rejected.
        size:
          type: string
          maxLength: 32
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,6})?$"
          description: Positive shares, at most 1000000000000, up to 6 decimal places.
        expiration:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Limit order duration in seconds; nonzero values require price.
        sell_all:
          type: boolean
          default: false
        sell_percentage:
          type: string
          maxLength: 32
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,4})?$"
          description: Percentage greater than 0 and at most 100, up to 4 decimal
            places.
        metadata:
          "$ref": "#/components/schemas/OrderMetadata"
