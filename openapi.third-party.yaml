openapi: 3.0.3
info:
  title: PolyCop OpenAPI
  version: 0.1.0
  license:
    name: Proprietary
  description: |
    Public third-party API for PolyCop, authenticated with API key and HMAC-SHA256.
    Partner keys provision users and issue user keys; use each user's key for their trading requests.
    Custodial wallets only. Partner user keys cannot withdraw or use wildcard scopes.
    Eligible direct account keys and legacy Partner Keys require withdraw:create and account-level 2FA to create Polygon withdrawals.
    This is not a Polymarket CLOB-compatible API.
    Global, source IP, and endpoint limits also apply to unauthenticated requests; 429 does not confirm valid credentials.
servers:
- url: https://test-eu.polycopy.fun/openapi/v1
  description: Test environment only; not production
x-doc-classification:
  level_1:
  - Third-party API
  level_2:
    Third-party API:
      programmatic_trading: API key plus HMAC
  level_3:
    Third-party API:
    - wallet
    - orders
    - positions
    - trading
    - activity
    - settings
    - copytrade
    - afk
    - withdraw
    - partner
tags:
- name: Partner
  description: Partner-only APIs for provisioning partner users and creating user
    API keys.
- name: Wallet
  description: Custodial wallet balance and Polygon withdrawal APIs.
- name: Orders
  description: Programmatic order placement, listing, lookup, and cancellation.
- name: Positions
  description: Account position query APIs.
- name: Copytrade
  description: Copytrade configuration, market filters, keywords, and execution records.
- name: AFK
  description: AFK strategy configuration and execution records.
- name: Trading
paths:
  "/partner/users":
    get:
      tags:
      - Partner
      summary: List partner users
      operationId: listPartnerUsers
      description: Requires a partner API key with `partner:users:manage` scope. Legacy
        Partner Keys may use `*`; new keys reject wildcard scopes. Results are ordered
        by newest partner user first. Use the returned `next_cursor` as the next request's
        `cursor`. Results include user identifiers, wallet state and addresses, creation
        time, and recent activity; secrets are omitted.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/Cursor"
      responses:
        '200':
          description: Partner user list
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/PartnerUserListData"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
    post:
      tags:
      - Partner
      summary: Create or get a partner user
      operationId: createPartnerUser
      description: Requires a partner API key with `partner:users:manage` scope. Legacy
        Partner Keys may use `*`; new keys reject wildcard scopes.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PartnerUserCreateRequest"
      responses:
        '200':
          description: Partner user created or returned
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/PartnerUserData"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
  "/partner/users/{user_account_id}/api-keys":
    post:
      tags:
      - Partner
      summary: Create a user API key for a partner user
      operationId: createPartnerUserApiKey
      description: Requires a partner API key with `partner:api_keys:manage` scope.
        Legacy Partner Keys may use `*`; new keys reject wildcard scopes. The partner
        user must have `wallet_status=ready`; if it is `pending` or `failed`, retry
        create-or-get for the same `external_user_id` before creating the user API
        key. Save the secret from the creation response securely. An idempotent replay
        returns the original secret and expires_at without extending the deadline,
        even if the user key has since expired. Issue a replacement as a separate
        operation.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - name: user_account_id
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PartnerUserApiKeyCreateRequest"
      responses:
        '200':
          description: User API key created
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/CreateApiKeyData"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
  "/partner/users/{user_account_id}/api-keys/{key_id}":
    delete:
      tags:
      - Partner
      summary: Revoke a user API key for a partner user
      operationId: revokePartnerUserApiKey
      description: Requires a partner API key with `partner:api_keys:manage` scope.
        Legacy Partner Keys may use `*`; new keys reject wildcard scopes. Only revokes
        user API keys created by the authenticated partner for the specified `user_account_id`;
        it cannot revoke another partner's keys or direct account keys.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - name: user_account_id
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/AccountId"
      - "$ref": "#/components/parameters/KeyId"
      responses:
        '200':
          description: User API key revoked
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                          enum:
                          - revoked
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
  "/wallet":
    get:
      x-required-scope: wallet:read
      tags:
      - Wallet
      summary: Get wallet and balances
      operationId: getWallet
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/ForceRefresh"
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/Wallet"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
      description: |-
        Required scope: `wallet:read`.

        Returns wallet addresses and balances for the authenticated account.
  "/wallet/withdraw":
    post:
      x-required-scope: withdraw:create
      tags:
      - Wallet
      summary: Create a Polygon withdrawal
      operationId: createWithdrawal
      parameters:
      - "$ref": "#/components/parameters/RequiredIdempotencyKey"
      description: |-
        Required scope: `withdraw:create`.

        Creates a Polygon withdrawal for an eligible account. Telegram accounts and Partner user keys receive 403 FORBIDDEN. Status queries remain available.
        Requires 2FA and Idempotency-Key. Keep the original Idempotency-Key and exact body, including 2fa, on retries; refresh the HMAC signing headers. A different body with the same Idempotency-Key returns CONFLICT. Idempotency covers the account across credentials and withdrawal routes; records do not expire automatically. Recover a lost response with GET /wallet/withdrawals/by-key.
        Limit: 5 requests per minute per account. Only one withdrawal may be processing, submitting, or submitted at a time. A new withdrawal requires the previous one to be succeeded or failed.
        Submission and on-chain confirmation are separate. Success returns submitted, or succeeded if already confirmed. An uncertain submission can return HTTP 200 with withdraw_id and status=submitting. This does not confirm acceptance or on-chain success. Poll the withdrawal status and confirm the outcome before starting another withdrawal. An unresolved submitting withdrawal continues to block new withdrawals. The API does not automatically resubmit it.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateWithdrawalRequest"
      responses:
        '200':
          description: Withdrawal created
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/WithdrawalCreated"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationFailed"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          description: The withdrawal result is unavailable. Recover it using the
            original Idempotency-Key; do not start another withdrawal.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponse"
  "/wallet/withdrawals/by-key":
    get:
      x-required-scope: wallet:read
      tags:
      - Wallet
      summary: Recover a withdrawal by its original idempotency key
      description: |-
        Required scope: `wallet:read`.

        Returns the current withdrawal status for the authenticated account using the original Idempotency-Key. This query does not submit a withdrawal or require a 2FA code. Successful recovery responses include Cache-Control: no-store. Error responses may omit this header. Do not cache recovery results.
        Older withdrawals may not be found by Idempotency-Key. A 404 does not prove that a previous request was not executed; confirm its outcome before starting another withdrawal. See [withdrawal recovery](/concepts/idempotency#recover-a-withdrawal).
      operationId: getWithdrawalByKey
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/WithdrawalRecoveryKey"
      responses:
        '200':
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
          description: Withdrawal status
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/Withdrawal"
        '404':
          "$ref": "#/components/responses/NotFound"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '503':
          description: Recovery service unavailable; do not start another withdrawal.
        '409':
          "$ref": "#/components/responses/Conflict"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
  "/wallet/withdrawals/{withdraw_id}":
    get:
      x-required-scope: wallet:read
      tags:
      - Wallet
      summary: Get withdrawal status
      operationId: getWithdrawal
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/WithdrawId"
      responses:
        '200':
          description: Withdrawal status
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/Withdrawal"
        '404':
          "$ref": "#/components/responses/NotFound"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
      description: |-
        Required scope: `wallet:read`.

        Returns the status of a withdrawal belonging to the authenticated account.
  "/orders":
    post:
      x-required-scope: trade:order
      tags:
      - Orders
      summary: Place an order
      operationId: placeOrder
      parameters:
      - "$ref": "#/components/parameters/RequiredOrderIdempotencyKey"
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlaceOrderRequest"
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/OrderResult"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '422':
          "$ref": "#/components/responses/ValidationFailed"
        '409':
          description: Idempotency-Key reused with different parameters, or the original
            request is still processing. Keep the original request and reconcile;
            do not generate a new Idempotency-Key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Order service failure or unknown order result. Retain the original
            Idempotency-Key and business_request_id; a retry with the same account
            and Idempotency-Key never automatically resubmits an unknown result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: The order result is unavailable. If ORDER_RESULT_UNKNOWN is
            returned, keep the original Idempotency-Key and request and confirm the
            outcome. Do not submit under a new Idempotency-Key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
      description: |-
        Required scope: `trade:order`.

        Places an order for the authenticated account. Requires Idempotency-Key. Keep the original Idempotency-Key and request when retrying; order idempotency applies across credentials for the same account.
    get:
      x-required-scope: trade:read
      tags:
      - Orders
      summary: List account orders
      description: |-
        Required scope: `trade:read`.

        Returns an empty `items` array when the account has no matching orders. Items preserve the order returned by the service; `sortBy` and `sortDirection` are not supported query parameters and do not change the result order.
      operationId: listOrders
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/AddressQuery"
      - "$ref": "#/components/parameters/LocaleQuery"
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/OrderList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
  "/orders/{order_id}":
    get:
      x-required-scope: trade:read
      tags:
      - Orders
      summary: Get an order by order id
      description: |-
        Required scope: `trade:read`.

        Returns `ORDER_NOT_FOUND` when the order does not exist or does not belong to the current account.
      operationId: getOrder
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/OrderId"
      - "$ref": "#/components/parameters/AddressQuery"
      - "$ref": "#/components/parameters/LocaleQuery"
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/Order"
        '404':
          "$ref": "#/components/responses/NotFound"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
    delete:
      x-required-scope: trade:cancel
      tags:
      - Orders
      summary: Cancel an order
      operationId: cancelOrder
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/OrderId"
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      responses:
        '200':
          description: Cancel requested
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/CancelOrderData"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
      description: |-
        Required scope: `trade:cancel`.

        Cancels an order belonging to the authenticated account.
  "/positions":
    get:
      x-required-scope: positions:read
      tags:
      - Positions
      summary: List account positions
      operationId: listPositions
      description: |-
        Required scope: `positions:read`.

        Lists positions for wallets owned by the authenticated account. Omit address to use the default wallet. A signing address is resolved to its proxy wallet. Foreign or unverified wallets return 404, malformed addresses return 400, and unavailable ownership verification returns 502. Any copytrade configurations included in the response belong to the authenticated account. This endpoint does not provide public wallet lookup.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/PositionAddressQuery"
      - "$ref": "#/components/parameters/MarketQuery"
      - "$ref": "#/components/parameters/RedeemableQuery"
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/PositionList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/copytrade/configs":
    get:
      x-required-scope: copytrade:read
      tags:
      - Copytrade
      summary: List copytrade configs
      description: |-
        Required scope: `copytrade:read`.

        Returns an empty `items` array when the account has no copytrade configs.
      operationId: listCopytradeConfigs
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/Cursor"
      responses:
        '200':
          description: Copytrade configs
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/CopytradeConfigList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
    post:
      x-required-scope: copytrade:manage
      tags:
      - Copytrade
      summary: Create a copytrade config
      description: |-
        Required scope: `copytrade:manage`.

        Creates a copytrade configuration for the authenticated account. Requires API key HMAC authentication; 2FA is not required.
      operationId: createCopytradeConfig
      parameters:
      - "$ref": "#/components/parameters/RequiredActionIdempotencyKey"
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      requestBody:
        required: true
        content:
