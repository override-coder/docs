  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          description: Seconds to wait before retrying the same rate-limited bucket.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: Effective limit for the bucket that rejected the request.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          description: Remaining tokens in the bucket that rejected the request. Usually
            0 on 429.
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Reset:
          description: Seconds until the bucket is expected to accept another request.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ActionResultUnavailable:
      description: The API cannot confirm the operation's result. A 503 does not prove
        non-execution. Preserve the original key and request, confirm the outcome,
        and never automatically submit under a new key. Configuration and redemption
        operations can also return ORDER_RESULT_UNKNOWN; do not assume an exchange
        order ID or business_request_id exists for those operations.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  headers:
    NoStore:
      schema:
        type: string
        enum:
        - no-store
