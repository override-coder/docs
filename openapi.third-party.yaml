      - API_KEY_IP_WHITELIST_REQUIRED
      - API_KEY_SCOPE_REQUIRED
      - USER_API_KEY_WITHDRAW_DISABLED
      - TG_WITHDRAW_DISABLED
      - TRADING_TEMPORARILY_RESTRICTED
      - DEPENDENCY_UNAVAILABLE
    ClosedPositionList:
