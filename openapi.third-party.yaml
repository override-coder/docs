          enum:
          - 1
          - 2
          description: "`other`; enables or disables uncategorized/other markets."
        config_type:
          type: integer
          enum:
          - 1
          - 2
          description: "`config_type`; `1` means an application copytrade config,
            `2` means a template config."
    CopytradeConfigUpdateInput:
      type: object
      properties:
        target_address:
          type: string
          description: Optional on PATCH. Trader wallet address to follow; when omitted
            the existing target address is not changed.
        tag:
          type: string
          description: User-visible label for this copytrade config.
        copy_percentage:
          type: string
          description: Percentage of the trader's order size to copy. Decimal string;
        limit_order_copy:
          type: boolean
          description: Whether to copy buy limit orders. On PATCH, specify the desired
            final state.
        limit_order_validity_period:
          type: string
          description: Validity period for copied buy limit orders. Decimal/integer
            string.
        max_limit_order_price_diff:
          type: string
          description: Maximum allowed price difference for copied buy limit orders.
            Decimal string.
        max_token_spend:
          type: string
          description: Maximum token spend cap for this config. Decimal string.
        total_token_spend:
          type: string
          description: Total token spend cap for this config. Decimal string.
        buy_at_min:
          type: boolean
          description: Whether buy copy should use minimum-price behavior.
        copy_fixed_amount:
          type: string
          description: Fixed amount to copy per trade. Decimal string.
        min_trader_trade_amount:
          type: string
          description: Minimum source trader trade amount required before copying.
            Decimal string.
        max_trader_trade_amount:
          type: string
          description: Maximum source trader trade amount allowed for copying. Decimal
            string.
        min_copy_amount_per_trade:
          type: string
          description: Minimum copied amount per trade. Decimal string.
        max_copy_amount_per_trade:
          type: string
          description: Maximum copied amount per trade. Decimal string.
        min_price:
          type: string
          description: Minimum market/order price allowed for copying. Decimal string.
        max_price:
          type: string
          description: Maximum market/order price allowed for copying. Decimal string.
        slippage:
          type: string
          description: Buy-side market-order slippage tolerance. Decimal string.
        max_spend_per_market:
          type: string
          description: Maximum spend cap per market. Decimal string.
        max_holder_market_number:
          type: string
          description: Maximum number of holder markets allowed. Integer string.
        take_profit_percentage:
          type: string
          description: Take-profit trigger percentage. Decimal string.
        take_profit_price:
          type: string
          description: Take-profit trigger price. Decimal string.
        stop_loss_percentage:
          type: string
          description: Stop-loss trigger percentage. Decimal string.
        stop_loss_price:
          type: string
          description: Stop-loss trigger price. Decimal string.
        copy_buy:
          type: boolean
          description: Whether buy trades are copied. On PATCH, specify the desired
            final state.
        copy_sell:
          type: boolean
          description: Whether sell trades are copied. On PATCH, specify the desired
            final state.
        market_sell_slippage:
          type: string
          description: Sell-side market-order slippage tolerance. Decimal string.
        sell_limit_order_copy:
          type: boolean
          description: Whether to copy sell limit orders. On PATCH, specify the desired
            final state.
        sell_limit_order_price_diff:
          type: string
          description: Maximum allowed price difference for copied sell limit orders.
            Decimal string.
        sell_limit_order_validity_period:
          type: string
          description: Validity period for copied sell limit orders. Decimal/integer
            string.
        max_5m_market_start_time:
          type: string
          description: Earliest allowed start-time window for 5-minute markets. String.
        max_5m_market_end_time:
          type: string
          description: Latest allowed end-time window for 5-minute markets. String.
        max_15m_market_start_time:
          type: string
          description: Earliest allowed start-time window for 15-minute markets. String.
        max_15m_market_end_time:
          type: string
          description: Latest allowed end-time window for 15-minute markets. String.
        tp_balance_threshold:
          type: string
          description: Balance threshold used by take-profit logic. Decimal string.
        sl_balance_threshold:
          type: string
          description: Balance threshold used by stop-loss logic. Decimal string.
        reverse_copy:
          type: boolean
          description: Whether to invert copied trade direction. On PATCH, specify
            the desired final state.
        keyword_whitelist:
          description: Not accepted on PATCH. Use POST `/copytrade/configs/{config_id}/keywords`.
          readOnly: true
          type: array
          items:
            type: string
        keyword_blacklist:
          description: Not accepted on PATCH. Use POST `/copytrade/configs/{config_id}/keywords`.
          readOnly: true
          type: array
          items:
            type: string
        failure_retry:
          type: string
          description: Retry count/strategy value used after copy failure. String.
        limit_expired_to_market:
          type: boolean
          description: Whether expired copied limit orders may fall back to market
            orders.
        use_buy_order_book:
          type: boolean
          description: Whether buy copy uses order-book level settings.
        buy_bid_level:
          type: string
          description: Buy-side bid book level. String.
        buy_ask_level:
          type: string
          description: Buy-side ask book level. String.
        use_sell_order_book:
          type: boolean
          description: Whether sell copy uses order-book level settings.
        sell_bid_level:
          type: string
          description: Sell-side bid book level. String.
        sell_ask_level:
          type: string
          description: Sell-side ask book level. String.
        buy_order_book_mode:
          type: string
          description: Buy-side order-book mode. String.
        sell_order_book_mode:
          type: string
          description: Sell-side order-book mode. String.
        turbo_mode:
          type: boolean
          description: Whether to enable turbo mode for this config.
        status:
          "$ref": "#/components/schemas/CopytradeStatus"
    CopytradeKeywordInput:
      type: object
      required:
      - key_word
      - list_type
      - config_type
      properties:
        key_word:
          type: string
          description: Keyword text to add to the config keyword list.
        list_type:
          type: integer
          enum:
          - 1
          - 2
          description: "`list_type`; `1` means whitelist, `2` means blacklist."
        config_type:
          type: integer
          enum:
          - 1
          description: Must be 1 (application copytrade config); templates are not
            supported by this HTTP endpoint.
    CopytradeKeywordResult:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          description: keyword advisory code. Empty string means no advisory; KEYWORD_IN_BLACKLIST
            means the keyword also appears in the blacklist. This is not the outer
            API response code.
    CopytradeMutationResult:
      type: object
      additionalProperties: false
      description: Empty object acknowledging a successful keyword deletion or market-type
        update.
    CopytradeMarketTypesUpdateInput:
      allOf:
      - "$ref": "#/components/schemas/CopytradeMarketTypesInput"
      - type: object
        properties:
          config_type:
            type: integer
            enum:
            - 1
            description: Must be 1 (application copytrade config); templates are not
              supported by this HTTP endpoint.
    AFKStrategyList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/AFKStrategy"
    AFKStrategy:
      allOf:
      - "$ref": "#/components/schemas/AFKStrategyInput"
      - type: object
        required:
        - config_id
        - status
        properties:
          config_id:
            type: string
            description: AFK strategy id from `config_id`.
          status:
            "$ref": "#/components/schemas/AFKStatus"
          created_at:
            type: string
            format: date-time
            nullable: true
            description: Strategy create time derived from `create_dt`.
    AFKStrategyInput:
      type: object
      required:
      - market
      - side
      - buy_amount
      properties:
        tag:
          type: string
          description: User-visible strategy label.
        market:
          type: string
          description: Market identifier or market group configured for the AFK strategy.
        period:
          type: integer
          description: Trading period/window value.
        side:
          type: integer
          enum:
          - 1
          - 2
          description: Direction filter; `1` means Up, `2` means Down.
        time_start_sec:
          type: integer
          format: int64
          description: Start time in Unix seconds.
        time_end_sec:
          type: integer
          format: int64
          description: End time in Unix seconds.
        min_price:
          type: string
          description: Minimum allowed price. Decimal string.
        max_price:
          type: string
          description: Maximum allowed price. Decimal string.
        price_delta_min:
          type: string
          description: Minimum price delta filter. Decimal string.
        price_delta_max:
          type: string
          description: Maximum price delta filter. Decimal string.
        buy_amount:
          type: string
          description: Buy amount per AFK order. Decimal string.
        limit_price:
          type: string
          description: Limit order price when `limit_order_copy=1`. Decimal string.
        order_expired_ttl_seconds:
          type: integer
          description: Limit order expiration TTL in seconds.
        total_rounds:
          type: integer
          description: Maximum number of AFK trading rounds.
        take_profit_percentage:
          type: string
          description: Take-profit percentage trigger. Decimal string.
        take_profit_price:
          type: string
          description: Take-profit price trigger. Decimal string.
        stop_loss_percentage:
          type: string
          description: Stop-loss percentage trigger. Decimal string.
        stop_loss_price:
          type: string
          description: Stop-loss price trigger. Decimal string.
        limit_order_copy:
          type: integer
          enum:
          - 0
          - 1
          description: Order mode; `0` means market order, `1` means limit order.
        slippage:
          type: string
          description: Market order slippage percentage string, for example `2` means
            2%.
        use_kdj:
          type: integer
          enum:
          - 0
          - 1
          description: KDJ indicator filter switch; `0` disabled, `1` enabled.
        use_macd:
          type: integer
          enum:
          - 0
          - 1
          description: MACD indicator filter switch; `0` disabled, `1` enabled.
        use_atr:
          type: integer
          enum:
          - 0
          - 1
          description: ATR indicator filter switch; `0` disabled, `1` enabled.
    AFKStatus:
      type: string
      enum:
      - running
      - paused
      - disabled
      description: Public AFK strategy status.
    AFKStrategyCreateResult:
      type: object
      required:
      - status
      description: Creation acknowledgement without a strategy ID. Call GET /afk/strategies
        to read the created strategy.
      properties:
        status:
          type: string
          enum:
          - created
    AFKStrategyUpdateInput:
      allOf:
      - "$ref": "#/components/schemas/AFKStrategyInput"
      - type: object
        properties:
          status:
            "$ref": "#/components/schemas/AFKStatus"
    AFKRecordList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/AFKRecord"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page. Use it as the next request's `cursor`.
    AFKRecord:
      type: object
      additionalProperties: true
      description: AFK transaction record.
      properties:
        record_id:
          type: string
        strategy_id:
          type: integer
          format: uint64
          description: JavaScript clients must use lossless integer parsing and store
            this value as a bigint or decimal string in application state.
        round_id:
          type: integer
          format: int64
        wallet_address:
          type: string
        proxy_address:
          type: string
        tag:
          type: string
        trigger_asset_price:
          type: string
        trigger_btc_price:
          type: string
        trigger_btc_delta:
          type: string
        title:
          type: string
        event_slug:
          type: string
        slug:
          type: string
        conditional_id:
          type: string
        outcome:
          type: string
        asset:
          type: string
        closed:
          type: boolean
        side_type:
          type: string
        px:
          type: string
        amount:
          type: string
        amount_usd:
          type: string
        order_id:
          type: string
        hash:
          type: string
        timestamp:
          type: integer
          format: uint64
        order_type:
          type: string
        status:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          description: 'Record status: 1=success, 2=failed, 3=waiting, 4=cancel, 5=partially.
            For failed records (`2`), read `error_msg` for the failure reason.'
        take_profit_percentage:
          type: string
        take_profit_price:
          type: string
        stop_loss_percentage:
          type: string
        stop_loss_price:
          type: string
        slippage:
          type: string
        spend_req_micro:
          type: integer
          format: uint64
        spend_granted_micro:
          type: integer
          format: uint64
        size_matched:
          type: string
        error_msg:
          type: string
          nullable: true
          description: Failure reason when `status=2`, if returned by the service.
        create_dt:
          type: integer
          format: uint64
        update_dt:
          type: integer
          format: uint64
    CopytradeRecordList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CopytradeRecord"
        next_cursor:
          type: string
          nullable: true
    CopytradeRecord:
      type: object
      additionalProperties: true
      required:
      - outcome
      description: Copytrade transaction record.
      properties:
        record_id:
          type: string
        config_id:
          type: string
          pattern: "^[0-9]+$"
          description: Unsigned integer ID encoded as a decimal string.
        order_id:
          type: string
          nullable: true
        status:
          type: integer
          format: uint32
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          description: 'Record status: 1=success, 2=failed, 3=waiting, 4=cancel, 5=partially.
            For failed records (`2`), read `error_msg` when returned by the service.'
        error_msg:
          type: string
          nullable: true
          description: Failure reason when `status=2`, if returned by the service.
        market:
          type: string
        outcome:
          type: string
          description: Stored outcome label (for example Yes, No, or a team name).
            Empty string when unavailable.
        target_price:
          type: string
        target_amount:
          type: string
        target_amount_usd:
          type: string
        copy_price:
          type: string
        copy_amount:
          type: string
        copy_amount_usd:
          type: string
        side:
          type: string
        create_dt:
          type: string
          pattern: "^[0-9]+$"
          description: Unix seconds encoded as a decimal string.
        created_at:
          type: string
          format: date-time
          deprecated: true
          description: Legacy response field. Use create_dt in new responses.
    WebTradingReadiness:
