          - unknown
          x-enum-varnames:
          - WebTradingReadinessWalletStatusReady
          - WebTradingReadinessWalletStatusUnavailable
          - WebTradingReadinessWalletStatusNotInitialized
          - WebTradingReadinessWalletStatusUnknown
        two_fa_enabled:
