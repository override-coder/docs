  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          description: Seconds to wait before retrying requests subject to the exceeded
            limit.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: The request limit that was exceeded.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          description: Remaining requests under the exceeded limit, usually 0 in a
            429 response.
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Reset:
          description: Seconds until a request subject to this limit is expected to
            be allowed. This is a relative delay, not a Unix timestamp or a full quota
            reset.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ActionResultUnavailable:
      description: The API cannot confirm the operation's result. A 503 does not prove
        non-execution. Preserve the original Idempotency-Key and request, confirm
        the outcome, and never automatically submit under a new Idempotency-Key. Configuration
        and redemption operations can also return ORDER_RESULT_UNKNOWN; do not assume
        an exchange order ID or business_request_id exists for those operations.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  headers:
    NoStore:
      schema:
        type: string
        enum:
        - no-store
