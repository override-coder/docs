                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/ClosedPositionList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/activity":
    get:
      x-required-scope: activity:read
      tags:
      - Trading
      summary: List activity for the authenticated account
      operationId: listUserActivity
      description: |-
        Required scope: `activity:read`.

        Returns account activity using the filters and offset pagination documented below. If supplied, user must select a wallet owned by the authenticated account.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/PortfolioUserQuery"
      - name: limit
        in: query
        description: Values above 500 are capped to 500.
        schema:
          type: integer
          minimum: 0
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
      - "$ref": "#/components/parameters/PortfolioMarketQuery"
      - "$ref": "#/components/parameters/PortfolioEventIdQuery"
      - name: type
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - TRADE
            - SPLIT
            - MERGE
            - REDEEM
            - REWARD
            - CONVERSION
            - DEPOSIT
            - WITHDRAWAL
            - YIELD
            - MAKER_REBATE
            - TAKER_REBATE
            - REFERRAL_REWARD
      - name: excludeDepositsWithdrawals
        in: query
        description: Defaults to true; set to false to include deposit and withdrawal
          activity.
        schema:
          type: boolean
          default: true
      - name: start
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: end
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - TIMESTAMP
          - TOKENS
          - CASH
          default: TIMESTAMP
      - "$ref": "#/components/parameters/PortfolioSortDirectionQuery"
      - name: side
        in: query
        schema:
          type: string
          enum:
          - BUY
          - SELL
      responses:
        '200':
          description: User activity
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/UserActivityList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/positions/redeem":
    post:
      x-required-scope: positions:redeem
      tags:
      - Trading
      summary: Redeem a redeemable position
      description: |-
        Required scope: `positions:redeem`.

        Requests redemption for the authenticated user's default wallet and condition. Requires Idempotency-Key. A completed response for the same API key, Idempotency-Key, and request is replayed for 24 hours. If the result is uncertain, the API returns 409 REDEEM_RESULT_UNKNOWN; retries with that Idempotency-Key return the saved result without resubmitting. Refresh redeemable positions and confirm the outcome before further action. Deduplication is not guaranteed across different Idempotency-Key values or API credentials, expired records, interrupted requests, or other redemption entry points. Success acknowledges submission but includes no transaction ID or on-chain confirmation.
      operationId: redeemPosition
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/RequiredActionIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RedeemPositionRequest"
      responses:
        '200':
          description: Redemption request accepted
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/RedeemPositionResult"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationFailed"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
  "/settings/auto-claim":
    get:
      x-required-scope: settings:read
      tags:
      - Trading
      summary: Get automatic position redemption setting
      operationId: getAutoClaimSetting
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      responses:
        '200':
          description: Current automatic redemption setting
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/AutoClaimSetting"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '409':
          "$ref": "#/components/responses/Conflict"
      description: |-
        Required scope: `settings:read`.

        Returns the automatic redemption setting for the authenticated account.
    put:
      x-required-scope: settings:manage
      tags:
      - Trading
      summary: Set automatic position redemption
      description: |-
        Required scope: `settings:manage`.

        Sets the desired automatic redemption state: auto_claim=true enables it and false disables it. Returns the confirmed setting. A concurrent update for the same account can return 409 CONFLICT. Refresh the current setting before submitting a new update with a new idempotency key.
      operationId: updateAutoClaimSetting
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/RequiredActionIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AutoClaimSettingRequest"
      responses:
        '200':
          description: Automatic redemption setting updated
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/AutoClaimSetting"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key id. Keys expire within 180 days of creation; user keys
        cannot outlive the issuing parent deadline. Expired keys return 401 API_KEY_INVALID
        before idempotent replay.
    ApiTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: Unix timestamp in seconds. The default allowed clock skew is 15
        seconds in either direction. Confirm the allowed skew for your environment
        with PolyCop.
    ApiNonce:
      type: apiKey
      in: header
      name: X-Nonce
      description: Random nonce, unique for each HTTP request under the same API key.
        Generate a fresh nonce for every retry. Changing the timestamp does not allow
        nonce reuse.
    ApiSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-SHA256 signature.

        Malformed query encoding and repeated scalar query parameters return 400 BAD_REQUEST. Parameter names are URL-decoded before this check; duplicate values are rejected even when identical. Repeated keys are supported only for GET /positions (market), GET /closed-positions (market, eventId), and GET /activity (market, eventId, type). These array parameters also accept comma-separated values.

        Canonical string:
        `METHOD + "\n" + PATH + "\n" + QUERY + "\n" + TIMESTAMP + "\n" + NONCE + "\n" + BODY_SHA256`.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor from the previous response for the next page. This endpoint
        uses cursor pagination and does not support offset.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional for this endpoint. Use the same Idempotency-Key, API key,
        method, path, query, and body when retrying the same operation. Completed
        responses are normally available for replay for 24 hours; processing or blocked
        requests do not execute again on retry. Current authentication and permissions
        are required. Refresh HMAC signing headers on each retry. After a definite
        pre-execution validation failure, use a new Idempotency-Key for corrected
        input. See [Idempotency](/concepts/idempotency).
      schema:
        type: string
        maxLength: 128
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        example: pk_abc
    ForceRefresh:
      name: force_refresh
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Optional wallet refresh flag. Omit or use false for normal cached
        wallet reads.
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One account, the withdrawal operation, and this Idempotency-Key
        identify one withdrawal across API keys and withdrawal routes for the same
        account. Keep the original Idempotency-Key and exact body (including 2fa)
        on retry. Changed body returns 409. Records do not expire automatically. Current
        authentication and withdraw:create permission are required before replay;
        refresh HMAC signing headers. After a timeout, query withdrawals/by-key with
        the original Idempotency-Key, without OTP. A different Idempotency-Key is
        a new withdrawal request. Confirm the previous outcome before creating one.
        Some withdrawals may not be found by Idempotency-Key; a recovery 404 does
        not prove non-execution. Ambiguous matching records return 409 and require
        support reconciliation.
      schema:
        type: string
        maxLength: 128
    WithdrawalRecoveryKey:
      name: Idempotency-Key
      in: header
      required: true
      description: The original Idempotency-Key used to create the withdrawal. This
        lookup does not submit a withdrawal or require a 2FA code. A 404 does not
        prove that the request was not executed; confirm its outcome before starting
        another withdrawal.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WithdrawId:
      name: withdraw_id
      in: path
      required: true
      schema:
        type: string
        example: wd_202606011200000001
    RequiredOrderIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One account, order creation, and this Idempotency-Key identify
        one order across API keys and order routes for the same account. Keep the
        Idempotency-Key, query parameters, and exact body on retry; changed parameters
        return 409 CONFLICT. Current authentication and trade:order permission are
        required before replay. Refresh HMAC signing headers. An unknown result returns
        its saved response or a processing conflict on retry, without resubmission.
        Processing, unknown, failed, and completed order records do not expire automatically.
        After a definite validation failure, use a new Idempotency-Key for corrected
        parameters. An identical request with a different Idempotency-Key creates
        a distinct order request; another account has a separate scope. Keep the original
        Idempotency-Key and business_request_id and any order_id to confirm the outcome
        before creating another order. business_request_id is a support reference,
        not an exchange order ID. Ambiguous historical matches return 409 CONFLICT
        and require support reconciliation. Do not assume deduplication across other
        trading entry points.
      schema:
        type: string
        maxLength: 128
    AddressQuery:
      name: address
      in: query
      required: false
      schema:
        type: string
      description: Optional wallet address filter.
    LocaleQuery:
      name: locale
      in: query
      required: false
      schema:
        type: string
        example: en
      description: Optional locale.
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        example: 0xorder
    PositionAddressQuery:
      name: address
      in: query
      required: false
      schema:
        type: string
      description: Optional EVM signing or proxy address owned by the authenticated
        account. Omit for the current default wallet. Other account wallets and copytrade
        subwallets must also belong to this account; unknown or foreign addresses
        are rejected.
    MarketQuery:
      name: market
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: Optional repeated market filters, for example `?market=a&market=b`.
    RedeemableQuery:
      name: redeemable
      in: query
      required: false
      schema:
        type: boolean
      description: Optional redeemable-position filter.
    RequiredActionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for writes including automation configuration and redemption.
        Retry scope is account, credential, HTTP method, path, and Idempotency-Key;
        requests using different credentials are separate. Refresh HMAC signing headers.
        Current scopes are required before replay. Use the same Idempotency-Key and
        exact request body; a changed body returns CONFLICT. Deterministic responses
        below HTTP 500 are cached for 24 hours. An uncertain redemption returns REDEEM_RESULT_UNKNOWN
        and is not resubmitted on retry. Refresh redeemable positions and confirm
        the outcome instead of changing the Idempotency-Key or API credentials. After
        a definite validation failure, or a concurrent auto-claim conflict followed
        by a refreshed setting, use a new Idempotency-Key for the new operation.
      schema:
        type: string
        maxLength: 128
    ConfigId:
      name: config_id
      in: path
      required: true
      schema:
        type: string
        example: '123'
    KeyWordId:
      name: key_word_id
      in: path
      required: true
      description: ID of an existing keyword binding to delete. The public API does
        not provide a keyword-list endpoint or return keyword IDs when adding keywords;
        this operation requires an already-known ID.
      schema:
        type: integer
        minimum: 1
        maximum: 4294967295
        example: 456
    StrategyId:
      name: strategy_id
      in: path
      required: true
      description: AFK strategy config id.
      schema:
        type: string
        example: '123'
    CopytradeRecordLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    PortfolioUserQuery:
      name: user
      in: query
      required: false
      schema:
        type: string
        pattern: "^0x[0-9a-fA-F]{40}$"
      description: Polymarket user/proxy wallet. When provided it must belong to the
        authenticated account; omit it to use the default wallet.
    PortfolioMarketQuery:
      name: market
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
      description: Comma-separated condition IDs. Mutually exclusive with eventId.
    PortfolioTitleQuery:
      name: title
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    PortfolioEventIdQuery:
      name: eventId
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
      description: Comma-separated event IDs. Mutually exclusive with market.
    PortfolioSortDirectionQuery:
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: DESC
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - data
      - request_id
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          nullable: true
        request_id:
          type: string
          example: req_202606011200000001
        business_request_id:
          type: string
          description: Stable order support reference for the same account, create-order
            operation and Idempotency-Key across credentials and clients. Legacy records
            retain their original reference. Also returned in X-Business-Request-ID.
            Use it with the original Idempotency-Key for support reconciliation, not
            as an exchange order ID.
          example: ord_39dad9393e068dced11e313210e79e69f7a5a2355bdcf9390f89b22daa659d8b
    PartnerUserListData:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/PartnerUserListItem"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page. It is the last `user_account_id`
            from the current page; omit it when this field is absent.
    PartnerUserListItem:
      type: object
      required:
      - partner_account_id
      - user_account_id
      - external_user_id
      - status
      - wallet_status
      - created_at
      properties:
        partner_account_id:
          "$ref": "#/components/schemas/AccountId"
        user_account_id:
          "$ref": "#/components/schemas/AccountId"
        external_user_id:
          type: string
          example: user_123
        display_name:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
        wallet_status:
          type: string
          enum:
          - pending
          - ready
          - failed
        wallet_address:
          type: string
          nullable: true
          description: Public EVM wallet address for the partner user, when available.
          example: '0x0000000000000000000000000000000000000000'
        proxy_address:
          type: string
          nullable: true
          description: Public proxy wallet address for the partner user, when available.
          example: '0x0000000000000000000000000000000000000000'
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
          nullable: true
          description: Most recent usage time across user API keys created for this
            partner user.
    AccountId:
      type: string
      pattern: "^99[0-9]{20}$"
      example: '9912345678901234564821'
    ErrorResponse:
      allOf:
      - "$ref": "#/components/schemas/ApiResponse"
      - type: object
        properties:
          code:
            "$ref": "#/components/schemas/ErrorCode"
          data:
            nullable: true
            example:
    ErrorCode:
      type: string
      enum:
      - OK
      - BAD_REQUEST
      - FORBIDDEN
      - UNAUTHORIZED
      - NOT_FOUND
      - VALIDATION_FAILED
      - CONFLICT
      - RATE_LIMITED
      - INTERNAL_ERROR
      - MASTER_UNAVAILABLE
      - ACCOUNT_DISABLED
      - ACCOUNT_NOT_FOUND
      - API_KEY_INVALID
      - API_KEY_DISABLED
      - API_KEY_LIMIT_EXCEEDED
      - API_KEY_SIGNATURE_INVALID
      - API_KEY_TIMESTAMP_EXPIRED
      - API_KEY_NONCE_REPLAYED
      - PARTNER_USER_WALLET_NOT_READY
      - TWO_FA_NOT_ENABLED
      - TWO_FA_CODE_INVALID
      - TWO_FA_CODE_REPLAYED
      - TWO_FA_TOO_MANY_FAILURES
      - ORDER_PLACE_FAILED
      - ORDER_CANCEL_FAILED
      - ORDER_NOT_FOUND
      - ORDER_INSUFFICIENT_BALANCE
      - ORDER_RESULT_UNKNOWN
      - REDEEM_RESULT_UNKNOWN
      - WITHDRAW_2FA_REQUIRED
      - WITHDRAW_NETWORK_UNSUPPORTED
      - WITHDRAW_TOKEN_UNSUPPORTED
      - WITHDRAW_ADDRESS_INVALID
      - WITHDRAW_AMOUNT_INVALID
      - WITHDRAW_CREATE_FAILED
      - WITHDRAW_NOT_FOUND
      - WITHDRAW_RESULT_UNKNOWN
      - COPYTRADE_CONFIG_NOT_FOUND
      - COPYTRADE_CONFIG_INVALID
      - COPYTRADE_CREATE_FAILED
      - COPYTRADE_UPDATE_FAILED
    PartnerUserCreateRequest:
      type: object
      required:
      - external_user_id
      properties:
        external_user_id:
          type: string
          maxLength: 128
          description: Partner-side stable user id.
          example: user_123
        display_name:
          type: string
          maxLength: 128
          example: Alice
        email:
          type: string
          format: email
          maxLength: 255
          example: alice@example.com
    PartnerUserData:
      type: object
      required:
      - partner_account_id
      - user_account_id
      - external_user_id
      - status
      - wallet_status
      - created_at
      - updated_at
      properties:
        partner_account_id:
          "$ref": "#/components/schemas/AccountId"
        user_account_id:
          "$ref": "#/components/schemas/AccountId"
        external_user_id:
          type: string
          example: user_123
        display_name:
          type: string
        email:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
        wallet_status:
          type: string
          description: Wallet initialization status for this partner user. `ready`
            means the user's custodial trading wallet has been initialized; `pending`
            or `failed` means the partner may retry create-or-get for the same external_user_id
            to initialize the wallet.
          enum:
          - pending
          - ready
          - failed
        wallet_address:
          type: string
          nullable: true
          description: Public EVM wallet address for the partner user, when available.
          example: '0x0000000000000000000000000000000000000000'
        proxy_address:
          type: string
          nullable: true
          description: Public proxy wallet address for the partner user, when available.
          example: '0x0000000000000000000000000000000000000000'
        wallet_created:
          type: boolean
          nullable: true
        wallet_initialized_at:
          type: string
          format: date-time
          nullable: true
        last_active_at:
          type: string
          format: date-time
          nullable: true
          description: Most recent usage time across user API keys created for this
            partner user.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PartnerUserApiKeyCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: user trading key
        scopes:
          type: array
          maxItems: 32
          description: Defaults to trade:read, wallet:read, positions:read, copytrade:read,
            and afk:read. Additional read scopes are trading:read, activity:read,
            and settings:read. Explicit write scopes include trade:order, trade:cancel,
            copytrade:manage, afk:manage, positions:redeem, and settings:manage. Write
            scopes require a nonempty ip_whitelist. User keys cannot use `*` or `withdraw:create`.
            API keys have no independent monetary spending cap; strategy settings
            are separate.
          items:
            type: string
          example:
          - trade:order
          - wallet:read
        expires_at:
          type: string
          format: date-time
          description: Optional future UTC deadline. Defaults to the earlier of issuance
            plus 180 days and the issuing Partner Key expiry. An explicit deadline
            cannot exceed either limit.
        ip_whitelist:
          "$ref": "#/components/schemas/APIKeyIPWhitelist"
    APIKeyIPWhitelist:
      type: array
      maxItems: 64
      description: IPv4/IPv6 addresses or CIDRs. Global /0 ranges are rejected. A
        nonempty whitelist is required for write scopes and all HMAC write requests.
        An empty whitelist imposes no source-IP restriction on reads; authentication,
        permissions, and rate limits still apply. A configured whitelist restricts
        both reads and writes.
      items:
        type: string
      example:
      - 203.0.113.10/32
