        condition_id:
          type: string
        avg_price:
          type: string
        total_bought:
          type: string
        realized_pnl:
          type: string
        cur_price:
          type: string
        timestamp:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        icon:
          type: string
        event_slug:
          type: string
        outcome:
          type: string
        outcome_index:
          type: integer
