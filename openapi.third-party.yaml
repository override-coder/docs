openapi: 3.0.3
info:
  title: PolyCop OpenAPI
  version: 0.1.0
  license:
    name: Proprietary
  description: |
    Public third-party API for PolyCop, authenticated with API key and HMAC-SHA256.
    Partner keys provision users and issue user keys; use each user's key for their trading requests.
    Custodial wallets only. Partner user keys cannot withdraw or use wildcard scopes.
    Eligible non-user keys require account-level 2FA for Polygon withdrawals.
    This is not a Polymarket CLOB-compatible API.
    Global, source IP, and endpoint limits also apply to unauthenticated requests; 429 does not confirm valid credentials.
servers:
- url: https://test-eu.polycopy.fun/openapi/v1
  description: Test environment only; not production
x-doc-classification:
  level_1:
  - Third-party API
  level_2:
    Third-party API:
      programmatic_trading: API key plus HMAC
  level_3:
    Third-party API:
    - wallet
    - orders
    - positions
    - trading
    - activity
    - settings
    - copytrade
    - afk
    - withdraw
    - partner
tags:
- name: Partner
  description: Partner-only APIs for provisioning partner users and creating user
    API keys.
- name: Wallet
  description: Custodial wallet balance and Polygon withdrawal APIs.
- name: Orders
  description: Programmatic order placement, listing, lookup, and cancellation.
- name: Positions
  description: Account position query APIs.
- name: Copytrade
  description: Copytrade configuration, market filters, keywords, and execution records.
- name: AFK
  description: AFK strategy configuration and execution records.
- name: Trading
paths:
  "/partner/users":
    get:
      tags:
      - Partner
      summary: List partner users
      operationId: listPartnerUsers
      description: Requires a partner API key with `partner:users:manage` or `*` scope.
        Results are ordered by newest partner user first. Use the returned `next_cursor`
        as the next request's `cursor`. The response contains non-sensitive partner
        user information only.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/Cursor"
      responses:
        '200':
          description: Partner user list
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/PartnerUserListData"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
    post:
      tags:
      - Partner
      summary: Create or get a partner user
      operationId: createPartnerUser
      description: Requires a partner API key with `partner:users:manage` or `*` scope.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PartnerUserCreateRequest"
      responses:
        '200':
          description: Partner user created or returned
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/PartnerUserData"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
  "/partner/users/{user_account_id}/api-keys":
    post:
      tags:
      - Partner
      summary: Create a user API key for a partner user
      operationId: createPartnerUserApiKey
      description: Requires a partner API key with `partner:api_keys:manage` or `*`
        scope. The partner user must have `wallet_status=ready`; if it is `pending`
        or `failed`, retry create-or-get for the same `external_user_id` before creating
        the user API key. The returned secret is issued only once; an idempotent replay
        returns the original secret and expires_at without extending the deadline,
        even if that child key has since expired. Use a new business intent to issue
        a replacement key.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - name: user_account_id
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PartnerUserApiKeyCreateRequest"
      responses:
        '200':
          description: User API key created
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/CreateApiKeyData"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
  "/partner/users/{user_account_id}/api-keys/{key_id}":
    delete:
      tags:
      - Partner
      summary: Revoke a user API key for a partner user
      operationId: revokePartnerUserApiKey
      description: Requires a partner API key with `partner:api_keys:manage` or `*`
        scope. Only revokes user API keys created by the authenticated partner for
        the specified `user_account_id`; it cannot revoke another partner's keys or
        direct user keys.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - name: user_account_id
        in: path
        required: true
        schema:
          "$ref": "#/components/schemas/AccountId"
      - "$ref": "#/components/parameters/KeyId"
      responses:
        '200':
          description: User API key revoked
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                          enum:
                          - revoked
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
  "/wallet":
    get:
      x-required-scope: wallet:read
      tags:
      - Wallet
      summary: Get wallet and balances
      operationId: getWallet
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/ForceRefresh"
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/Wallet"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
  "/wallet/withdraw":
    post:
      x-required-scope: withdraw:create
      tags:
      - Wallet
      summary: Create a Polygon withdrawal
      operationId: createWithdrawal
      parameters:
      - "$ref": "#/components/parameters/RequiredIdempotencyKey"
      description: |-
        Creates a Polygon withdrawal for an eligible account. Telegram accounts and Partner user keys receive 403 FORBIDDEN. Status queries remain available.
        Requires 2FA and Idempotency-Key. Keep the original key and exact body, including 2fa, on retries; refresh the HMAC signing headers. A different body with the same key returns CONFLICT. Idempotency covers the account across credentials and withdrawal routes; records do not expire automatically. Recover a lost response with GET /wallet/withdrawals/by-key.
        Limit: 5 requests per minute per account. Only one withdrawal may be processing, submitting, or submitted at a time. A new withdrawal requires the previous one to be succeeded or failed.
        Submission and on-chain confirmation are separate. Success returns submitted, or succeeded if already confirmed. An uncertain submission can return HTTP 200 with withdraw_id and status=submitting. This does not confirm acceptance or on-chain success. Poll the withdrawal status and confirm the outcome before starting another withdrawal. An unresolved submitting withdrawal continues to block new withdrawals. The API does not automatically resubmit it.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateWithdrawalRequest"
      responses:
        '200':
          description: Withdrawal created
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/WithdrawalCreated"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationFailed"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          description: The withdrawal result is unavailable. Recover it using the
            original idempotency key; do not start another withdrawal.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponse"
  "/wallet/withdrawals/by-key":
    get:
      x-required-scope: wallet:read
      tags:
      - Wallet
      summary: Recover a withdrawal by its original idempotency key
      description: |-
        All recovery responses use Cache-Control: no-store; the key is a request header, not a cache selector.
        Read-only recovery scoped to the authenticated account; API keys require wallet:read.
        Returns the current withdrawal status without OTP or resubmission. Historical records have no key association and may return 404. A 404 is not
        proof that an earlier request was not executed: do not automatically use a new key.
      operationId: getWithdrawalByKey
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/WithdrawalRecoveryKey"
      responses:
        '200':
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
          description: Withdrawal status
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/Withdrawal"
        '404':
          "$ref": "#/components/responses/NotFound"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '503':
          description: Recovery service unavailable; do not create another intent.
        '409':
          "$ref": "#/components/responses/Conflict"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
  "/wallet/withdrawals/{withdraw_id}":
    get:
      x-required-scope: wallet:read
      tags:
      - Wallet
      summary: Get withdrawal status
      operationId: getWithdrawal
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/WithdrawId"
      responses:
        '200':
          description: Withdrawal status
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/Withdrawal"
        '404':
          "$ref": "#/components/responses/NotFound"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
  "/orders":
    post:
      x-required-scope: trade:order
      tags:
      - Orders
      summary: Place an order
      operationId: placeOrder
      parameters:
      - "$ref": "#/components/parameters/RequiredOrderIdempotencyKey"
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlaceOrderRequest"
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/OrderResult"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '422':
          "$ref": "#/components/responses/ValidationFailed"
        '409':
          description: Key reused with different parameters, or the original request
            is still processing. Keep the original intent and reconcile; do not create
            another key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Order service failure or unknown order result. Retain the original
            key and business_request_id; a same-account, same-key retry never automatically
            resubmits an unknown result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: The order result is unavailable. If ORDER_RESULT_UNKNOWN is
            returned, keep the original key and request and confirm the outcome. Do
            not submit under a new key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    get:
      x-required-scope: trade:read
      tags:
      - Orders
      summary: List account orders
      description: Returns an empty `items` array when the account has no matching
        orders. Items preserve the order returned by the service; `sortBy` and `sortDirection`
        are not supported query parameters and do not change the result order.
      operationId: listOrders
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/AddressQuery"
      - "$ref": "#/components/parameters/LocaleQuery"
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/OrderList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
  "/orders/{order_id}":
    get:
      x-required-scope: trade:read
      tags:
      - Orders
      summary: Get an order by order id
      description: Returns `ORDER_NOT_FOUND` when the order does not exist or does
        not belong to the current account.
      operationId: getOrder
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/OrderId"
      - "$ref": "#/components/parameters/AddressQuery"
      - "$ref": "#/components/parameters/LocaleQuery"
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/Order"
        '404':
          "$ref": "#/components/responses/NotFound"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
    delete:
      x-required-scope: trade:cancel
      tags:
      - Orders
      summary: Cancel an order
      operationId: cancelOrder
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/OrderId"
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      responses:
        '200':
          description: Cancel requested
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/CancelOrderData"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '503':
          "$ref": "#/components/responses/ActionResultUnavailable"
  "/positions":
    get:
      x-required-scope: positions:read
      tags:
      - Positions
      summary: List account positions
      operationId: listPositions
      description: Lists positions for wallets owned by the authenticated account.
        Omit address to use the default wallet. A signing address is resolved to its
        proxy wallet. Foreign or unverified wallets return 404, malformed addresses
        return 400, and unavailable ownership verification returns 502. Any copytrade
        configurations included in the response belong to the authenticated account.
        This endpoint does not provide public wallet lookup.
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/PositionAddressQuery"
      - "$ref": "#/components/parameters/MarketQuery"
      - "$ref": "#/components/parameters/RedeemableQuery"
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/PositionList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/copytrade/configs":
    get:
      x-required-scope: copytrade:read
      tags:
      - Copytrade
      summary: List copytrade configs
      description: Returns an empty `items` array when the account has no copytrade
        configs.
      operationId: listCopytradeConfigs
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      parameters:
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/Cursor"
      responses:
        '200':
          description: Copytrade configs
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/CopytradeConfigList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '502':
          "$ref": "#/components/responses/DependencyUnavailable"
    post:
      x-required-scope: copytrade:manage
      tags:
      - Copytrade
      summary: Create a copytrade config
      description: Creates a copytrade configuration for the authenticated account.
        Requires API key HMAC authentication; 2FA is not required.
      operationId: createCopytradeConfig
      parameters:
      - "$ref": "#/components/parameters/RequiredActionIdempotencyKey"
      security:
      - ApiKeyAuth: []
        ApiTimestamp: []
        ApiNonce: []
        ApiSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CopytradeConfigInput"
            example:
              target_address: '0x0000000000000000000000000000000000000000'
              tag: leader A
              copy_percentage: '100'
              copy_fixed_amount: ''
              max_token_spend: '1000'
              total_token_spend: '5000'
              min_copy_amount_per_trade: '1'
              max_copy_amount_per_trade: '100'
              min_price: '0.01'
              max_price: '0.99'
              slippage: '2'
              copy_buy: true
              copy_sell: true
              limit_order_copy: false
              sell_limit_order_copy: false
              reverse_copy: false
              keyword_whitelist: []
              keyword_blacklist: []
      responses:
        '200':
          description: Copytrade config created
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      "$ref": "#/components/schemas/CopytradeConfig"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/ValidationFailed"
        '429':
          "$ref": "#/components/responses/RateLimited"
