    CopytradeConfig:
      type: object
      required:
      - config_id
      - target_address
      - status
      description: |-
        Copytrade configuration and its current settings.

        For 5/15-minute market windows, copying is allowed in either configured start or end window when both are positive. If neither window is positive, no time-window restriction applies. Turbo mode bypasses these window checks.
      properties:
        telegram_id:
          type: string
          description: Account identifier associated with this configuration. Do not
            assume it is the person’s Telegram user ID; use user_account_id for Partner
            user management.
        config_id:
          type: string
          example: '123'
          description: Copytrade configuration ID. Use this value in configuration
            request paths.
        target_address:
          type: string
          description: Trader wallet address to follow.
        tag:
          type: string
          nullable: true
          description: User-visible label for this copytrade configuration.
        copy_percentage:
          type: string
          nullable: true
          description: Percentage of the source buy amount to copy, expressed as a
            decimal string; `50` means 50%. A positive copy_fixed_amount takes precedence.
        limit_order_copy:
          type: boolean
          nullable: true
          description: Whether copied buys use limit orders; false selects market
            orders.
        limit_order_validity_period:
          type: string
          nullable: true
          description: Buy limit-order lifetime in seconds, expressed as a string.
            A positive value sets an expiration; without a positive value the order
            remains good until cancelled.
        max_limit_order_price_diff:
          type: string
          nullable: true
          description: Price offset added to the copied buy price when order-book
            pricing is disabled. An absolute decimal price difference, not a percentage.
        max_token_spend:
          type: string
          nullable: true
          description: Maximum buy spend per outcome token, in USD, for this configuration.
            A positive value enables the limit; turbo mode bypasses it.
        total_token_spend:
          type: string
          nullable: true
          description: Maximum total buy spend in USD for this configuration, not
            the amount already spent. A positive value enables the limit; turbo mode
            bypasses it.
        buy_at_min:
          type: boolean
          nullable: true
          description: Whether to raise a copied buy to the applicable minimum order
            amount or share quantity when it would otherwise be too small.
        create_dt:
          type: string
          nullable: true
          description: Configuration creation time as a Unix timestamp string.
        copy_fixed_amount:
          type: string
          nullable: true
          description: Fixed buy amount in USD, expressed as a decimal string. A positive
            value takes precedence over percentage sizing and per-trade sizing bounds.
        min_trader_trade_amount:
          type: string
          nullable: true
          description: Minimum source buy value in USD eligible for copying. Decimal
            string.
        min_copy_amount_per_trade:
          type: string
          nullable: true
          description: Minimum copied buy amount in USD for percentage-based sizing.
            Not applied when copy_fixed_amount is positive.
        max_copy_amount_per_trade:
          type: string
          nullable: true
          description: Maximum copied buy amount in USD for percentage-based sizing.
            Not applied when copy_fixed_amount is positive.
        min_price:
          type: string
          nullable: true
          description: Minimum outcome-token price eligible for copied buys. Decimal
            string.
        max_price:
          type: string
          nullable: true
          description: Maximum outcome-token price eligible for copied buys. Decimal
            string.
        slippage:
          type: string
          nullable: true
          description: Buy market-order slippage percentage, expressed as a decimal
            string; `2` means 2%.
        max_spend_per_market:
          type: string
          nullable: true
          description: Maximum buy spend per market in USD for this configuration.
            A positive value enables the limit; turbo mode bypasses it.
        max_holder_market_number:
          type: string
          nullable: true
          description: Maximum number of markets held by this configuration. Positive
            integer string; turbo mode bypasses this limit.
        take_profit_percentage:
          type: string
          nullable: true
          description: Take-profit increase from the entry price, in percent; `10`
            means 10%. A positive take_profit_price takes precedence.
        take_profit_price:
          type: string
          nullable: true
          description: Absolute outcome-token price that triggers take profit. Decimal
            string; a positive value takes precedence over take_profit_percentage.
        stop_loss_percentage:
          type: string
          nullable: true
          description: Stop-loss decrease from the entry price, in percent; `10` means
            10%. A positive stop_loss_price takes precedence.
        stop_loss_price:
          type: string
          nullable: true
          description: Absolute outcome-token price that triggers stop loss. Decimal
            string; a positive value takes precedence over stop_loss_percentage.
        copy_buy:
          type: boolean
          nullable: true
          description: Whether to copy source buy trades.
        copy_sell:
          type: boolean
          nullable: true
          description: Whether to copy source sell trades.
        market_sell_slippage:
          type: string
          nullable: true
          description: Sell market-order slippage percentage, expressed as a decimal
            string; `2` means 2%.
        sell_limit_order_copy:
          type: boolean
          nullable: true
          description: Whether copied sells use limit orders; false selects market
            orders.
        sell_limit_order_price_diff:
          type: string
          nullable: true
          description: Price offset added to the copied sell price when order-book
            pricing is disabled. An absolute decimal price difference, not a percentage.
        sell_limit_order_validity_period:
          type: string
          nullable: true
          description: Sell limit-order lifetime in seconds, expressed as a string.
            A positive value sets an expiration; without a positive value the order
            remains good until cancelled.
        max_5m_market_start_time:
          type: string
          nullable: true
          description: Number of seconds after the market opens during which buys
            may be copied in 5-minute Up/Down markets. Positive integer string. See
            the market-window combination rule in this schema.
        max_5m_market_end_time:
          type: string
          nullable: true
          description: Number of seconds before the market closes during which buys
            may be copied in 5-minute Up/Down markets. Positive integer string. See
            the market-window combination rule in this schema.
        max_15m_market_start_time:
          type: string
          nullable: true
          description: Number of seconds after the market opens during which buys
            may be copied in 15-minute Up/Down markets. Positive integer string. See
            the market-window combination rule in this schema.
        max_15m_market_end_time:
          type: string
          nullable: true
          description: Number of seconds before the market closes during which buys
            may be copied in 15-minute Up/Down markets. Positive integer string. See
            the market-window combination rule in this schema.
        tp_balance_threshold:
          type: string
          nullable: true
          description: Account-value threshold for pausing this configuration when
            the value is at or above it. Account value includes available trading
            balance and position value. Decimal amount.
        sl_balance_threshold:
          type: string
          nullable: true
          description: Account-value threshold for pausing this configuration when
            the value is at or below it. Account value includes available trading
            balance and position value. Decimal amount.
        reverse_copy:
          type: boolean
          nullable: true
          description: Whether to copy the opposite market outcome. This changes the
            outcome token, not the buy/sell side.
        is_master:
          type: boolean
          nullable: true
          description: Whether this configuration uses the main wallet (true) or a
            sub-wallet (false).
        total_investment:
          type: string
          nullable: true
          description: Investment amount allocated to this configuration. Decimal
            amount.
        wallet_address:
          type: string
          nullable: true
          description: The copier’s main wallet signing address.
        proxy_address:
          type: string
          nullable: true
          description: The copier’s main proxy wallet address.
        sub_address:
          type: string
          nullable: true
          description: Sub-wallet signing address used for an isolated configuration,
            when present.
        sub_proxy_address:
          type: string
          nullable: true
          description: Sub-wallet proxy address used for an isolated configuration,
            when present.
        max_trader_trade_amount:
          type: string
          nullable: true
          description: Maximum source buy value in USD eligible for copying. Decimal
            string.
        failure_retry:
          type: string
          nullable: true
          description: Number of retries after an eligible copy-order failure, expressed
            as an integer string. Execution limits retries to at most 3.
        limit_expired_to_market:
          type: boolean
          nullable: true
          description: Whether an expired copied limit order may be retried as a market
            order.
        use_buy_order_book:
          type: boolean
          nullable: true
          description: Whether to select the copied buy limit price from the order
            book instead of applying max_limit_order_price_diff.
        buy_bid_level:
          type: string
          nullable: true
          description: Order-book bid level for copied buy limit orders in `bid` mode.
            Positive integer string; `1` selects the best bid price.
        buy_ask_level:
          type: string
          nullable: true
          description: Order-book ask level for copied buy limit orders in `ask` mode.
            Positive integer string; `1` selects the best ask price.
        use_sell_order_book:
          type: boolean
          nullable: true
          description: Whether to select the copied sell limit price from the order
            book instead of applying sell_limit_order_price_diff.
        sell_bid_level:
          type: string
          nullable: true
          description: Order-book bid level for copied sell limit orders in `bid`
            mode. Positive integer string; `1` selects the best bid price.
        sell_ask_level:
          type: string
          nullable: true
          description: Order-book ask level for copied sell limit orders in `ask`
            mode. Positive integer string; `1` selects the best ask price.
        buy_order_book_mode:
          type: string
          nullable: true
          description: 'Price source for copied buy limit orders when use_buy_order_book
            is true: `bid`, `ask`, or `mid` (midpoint of best bid and ask). Bid or
            ask mode requires its matching level only; mid accepts neither level.'
        sell_order_book_mode:
          type: string
          nullable: true
          description: 'Price source for copied sell limit orders when use_sell_order_book
            is true: `bid`, `ask`, or `mid` (midpoint of best bid and ask). Bid or
            ask mode requires its matching level only; mid accepts neither level.'
        turbo_mode:
          type: boolean
          nullable: true
          description: Whether to enable turbo mode. It bypasses buy spend caps, held-market
            limits, market-type and keyword filters, and the 5/15-minute market-window
            checks.
        status:
          "$ref": "#/components/schemas/CopytradeStatus"
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Derived from `create_dt` when available.
        updated_at:
          type: string
          format: date-time
          nullable: true
    CopytradeStatus:
      type: string
      enum:
      - running
      - paused
      - disabled
    CopytradeConfigInput:
      type: object
      required:
      - target_address
      properties:
        target_address:
          type: string
          description: Trader wallet address to follow.
        tag:
          type: string
          description: User-visible label for this copytrade configuration.
        copy_percentage:
          type: string
          description: Percentage of the source buy amount to copy, expressed as a
            decimal string; `50` means 50%. A positive copy_fixed_amount takes precedence.
        limit_order_copy:
          type: boolean
          description: Whether copied buys use limit orders; false selects market
            orders.
        limit_order_validity_period:
          type: string
          description: Buy limit-order lifetime in seconds, expressed as a string.
            A positive value sets an expiration; without a positive value the order
            remains good until cancelled.
        max_limit_order_price_diff:
          type: string
          description: Price offset added to the copied buy price when order-book
            pricing is disabled. An absolute decimal price difference, not a percentage.
        max_token_spend:
          type: string
          description: Maximum buy spend per outcome token, in USD, for this configuration.
            A positive value enables the limit; turbo mode bypasses it.
        total_token_spend:
          type: string
          description: Maximum total buy spend in USD for this configuration, not
            the amount already spent. A positive value enables the limit; turbo mode
            bypasses it.
        buy_at_min:
          type: boolean
          description: Whether to raise a copied buy to the applicable minimum order
            amount or share quantity when it would otherwise be too small.
        copy_fixed_amount:
          type: string
          description: Fixed buy amount in USD, expressed as a decimal string. A positive
            value takes precedence over percentage sizing and per-trade sizing bounds.
        min_trader_trade_amount:
          type: string
          description: Minimum source buy value in USD eligible for copying. Decimal
            string.
        max_trader_trade_amount:
          type: string
          description: Maximum source buy value in USD eligible for copying. Decimal
            string.
        min_copy_amount_per_trade:
          type: string
          description: Minimum copied buy amount in USD for percentage-based sizing.
            Not applied when copy_fixed_amount is positive.
        max_copy_amount_per_trade:
          type: string
          description: Maximum copied buy amount in USD for percentage-based sizing.
            Not applied when copy_fixed_amount is positive.
        min_price:
          type: string
          description: Minimum outcome-token price eligible for copied buys. Decimal
            string.
        max_price:
          type: string
          description: Maximum outcome-token price eligible for copied buys. Decimal
            string.
        slippage:
          type: string
          description: Buy market-order slippage percentage, expressed as a decimal
            string; `2` means 2%.
        max_spend_per_market:
          type: string
          description: Maximum buy spend per market in USD for this configuration.
            A positive value enables the limit; turbo mode bypasses it.
        max_holder_market_number:
          type: string
          description: Maximum number of markets held by this configuration. Positive
            integer string; turbo mode bypasses this limit.
        take_profit_percentage:
          type: string
          description: Take-profit increase from the entry price, in percent; `10`
            means 10%. A positive take_profit_price takes precedence.
        take_profit_price:
          type: string
          description: Absolute outcome-token price that triggers take profit. Decimal
            string; a positive value takes precedence over take_profit_percentage.
        stop_loss_percentage:
          type: string
          description: Stop-loss decrease from the entry price, in percent; `10` means
            10%. A positive stop_loss_price takes precedence.
        stop_loss_price:
          type: string
          description: Absolute outcome-token price that triggers stop loss. Decimal
            string; a positive value takes precedence over stop_loss_percentage.
        copy_buy:
          type: boolean
          description: Whether to copy source buy trades.
        copy_sell:
          type: boolean
          description: Whether to copy source sell trades.
        market_sell_slippage:
          type: string
          description: Sell market-order slippage percentage, expressed as a decimal
            string; `2` means 2%.
        sell_limit_order_copy:
          type: boolean
          description: Whether copied sells use limit orders; false selects market
            orders.
        sell_limit_order_price_diff:
          type: string
          description: Price offset added to the copied sell price when order-book
            pricing is disabled. An absolute decimal price difference, not a percentage.
        sell_limit_order_validity_period:
          type: string
          description: Sell limit-order lifetime in seconds, expressed as a string.
            A positive value sets an expiration; without a positive value the order
            remains good until cancelled.
        max_5m_market_start_time:
          type: string
          description: Number of seconds after the market opens during which buys
            may be copied in 5-minute Up/Down markets. Positive integer string. See
            the market-window combination rule in this schema.
        max_5m_market_end_time:
          type: string
          description: Number of seconds before the market closes during which buys
            may be copied in 5-minute Up/Down markets. Positive integer string. See
            the market-window combination rule in this schema.
        max_15m_market_start_time:
          type: string
          description: Number of seconds after the market opens during which buys
            may be copied in 15-minute Up/Down markets. Positive integer string. See
            the market-window combination rule in this schema.
        max_15m_market_end_time:
          type: string
          description: Number of seconds before the market closes during which buys
            may be copied in 15-minute Up/Down markets. Positive integer string. See
            the market-window combination rule in this schema.
        tp_balance_threshold:
          type: string
          description: Account-value threshold for pausing this configuration when
            the value is at or above it. Account value includes available trading
            balance and position value. Decimal amount.
        sl_balance_threshold:
          type: string
          description: Account-value threshold for pausing this configuration when
            the value is at or below it. Account value includes available trading
            balance and position value. Decimal amount.
        reverse_copy:
          type: boolean
          description: Whether to copy the opposite market outcome. This changes the
            outcome token, not the buy/sell side.
        is_master:
          type: boolean
          description: Whether this configuration uses the main wallet (true) or a
            sub-wallet (false). Set at creation; not supported by configuration updates.
        total_investment:
          type: string
          description: Investment amount allocated to this configuration. Decimal
            amount. Set at creation; not supported by configuration updates.
        only_copy_markets_types:
          "$ref": "#/components/schemas/CopytradeMarketTypesInput"
        keyword_whitelist:
          description: Create-time whitelist keywords. For later changes use POST
            `/copytrade/configs/{config_id}/keywords`.
          type: array
          items:
            type: string
        keyword_blacklist:
          description: Create-time blacklist keywords. For later changes use POST
            `/copytrade/configs/{config_id}/keywords`.
          type: array
          items:
            type: string
        failure_retry:
          type: string
          description: Number of retries after an eligible copy-order failure, expressed
            as an integer string. Execution limits retries to at most 3.
        limit_expired_to_market:
          type: boolean
          description: Whether an expired copied limit order may be retried as a market
            order.
        use_buy_order_book:
          type: boolean
          description: Whether to select the copied buy limit price from the order
            book instead of applying max_limit_order_price_diff.
        buy_bid_level:
          type: string
          description: Order-book bid level for copied buy limit orders in `bid` mode.
            Positive integer string; `1` selects the best bid price.
        buy_ask_level:
          type: string
          description: Order-book ask level for copied buy limit orders in `ask` mode.
            Positive integer string; `1` selects the best ask price.
        use_sell_order_book:
          type: boolean
          description: Whether to select the copied sell limit price from the order
            book instead of applying sell_limit_order_price_diff.
        sell_bid_level:
          type: string
          description: Order-book bid level for copied sell limit orders in `bid`
            mode. Positive integer string; `1` selects the best bid price.
        sell_ask_level:
          type: string
          description: Order-book ask level for copied sell limit orders in `ask`
            mode. Positive integer string; `1` selects the best ask price.
        buy_order_book_mode:
          type: string
          description: 'Price source for copied buy limit orders when use_buy_order_book
            is true: `bid`, `ask`, or `mid` (midpoint of best bid and ask). Bid or
            ask mode requires its matching level only; mid accepts neither level.'
        sell_order_book_mode:
          type: string
          description: 'Price source for copied sell limit orders when use_sell_order_book
            is true: `bid`, `ask`, or `mid` (midpoint of best bid and ask). Bid or
            ask mode requires its matching level only; mid accepts neither level.'
        turbo_mode:
          type: boolean
          description: Whether to enable turbo mode. It bypasses buy spend caps, held-market
            limits, market-type and keyword filters, and the 5/15-minute market-window
            checks.
        status:
          "$ref": "#/components/schemas/CopytradeStatus"
      description: For 5/15-minute market windows, copying is allowed in either configured
        start or end window when both are positive. If neither window is positive,
        no time-window restriction applies. Turbo mode bypasses these window checks.
    CopytradeMarketTypesInput:
      type: object
      required:
      - config_type
      description: Copytrade market-type switches. For switch fields, `1` enables
        and `2` disables the selection. Omit fields to leave them unchanged on update.
      properties:
        all:
          type: integer
          enum:
          - 1
          - 2
